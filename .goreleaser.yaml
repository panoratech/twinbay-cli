# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# The archive name_template below interpolates .ProjectName, which GoReleaser
# otherwise defaults to the repository name — publishing twinbay-cli_Darwin_arm64.tar.gz
# while scripts/install.sh fetches twinbay_Darwin_arm64.tar.gz. See .genignore.
project_name: twinbay

before:
  hooks:
    - go mod tidy

builds:
  - id: twinbay
    main: ./cmd/twinbay
    binary: twinbay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildTime={{.Date}}

archives:
  - id: twinbay
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

release:
  github:
    owner: panoratech
    name: twinbay-cli
  draft: false
  prerelease: auto
  mode: append

# Publishes Casks/twinbay.rb to panoratech/homebrew-tap, so users can run
# `brew install panoratech/tap/twinbay`. Skipped until the release workflow
# has a HOMEBREW_TAP_GITHUB_TOKEN secret that can push to the tap repository.
homebrew_casks:
  - name: twinbay
    ids: [twinbay]
    binaries: [twinbay]
    homepage: https://twinbay.ai
    description: Command-line interface for the Twinbay API
    license: MIT
    repository:
      owner: panoratech
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/twinbay"]
          end

checksum:
  name_template: "checksums.txt"
