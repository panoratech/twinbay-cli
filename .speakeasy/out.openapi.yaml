components:
  schemas:
    AdvanceEnvironmentRequest:
      properties:
        at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "At"
          description: "Instant to advance the environment to. Defaults to now."
      additionalProperties: false
      type: "object"
      title: "AdvanceEnvironmentRequest"
    ApiKeyResponse:
      properties:
        id:
          type: "string"
          format: "uuid"
          title: "Id"
        name:
          type: "string"
          title: "Name"
        created_at:
          type: "string"
          format: "date-time"
          title: "Created At"
        expires_at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Expires At"
          description: "When the key stops working, or null when it never does"
        created_by:
          $ref: "#/components/schemas/UserResponse"
          description: "The member whose role the key acts with. Demoting or removing them changes what the key can do."
      type: "object"
      required:
        - "id"
        - "name"
        - "created_at"
        - "expires_at"
        - "created_by"
      title: "ApiKeyResponse"
    CreateApiKeyRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
          description: "What this key is for, in the operator's words"
        expires_at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Expires At"
          description: "When the key stops working on its own. Omitted or null for a key that only stops when it is revoked."
      additionalProperties: false
      type: "object"
      required:
        - "name"
      title: "CreateApiKeyRequest"
    CreateEnvironmentRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
          description: "Display name of the new environment. Generated when omitted."
        twins:
          anyOf:
            - items:
                anyOf:
                  - type: "string"
                    maxLength: 100
                    minLength: 1
                  - $ref: "#/components/schemas/CreateEnvironmentTwinRequest"
              type: "array"
              maxItems: 25
              minItems: 1
            - type: "null"
          title: "Twins"
          description: "Provider twins to provision, as slugs or objects with an optional seed. Omitted when a scenario supplies the twins."
        scenario:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
          title: "Scenario"
          description: "A saved environment definition to start from, instead of listing twins. Its twins are used as they were saved."
        save_as_scenario:
          type: "boolean"
          title: "Save As Scenario"
          description: "Also save this environment's definition, so another environment can be started from it later."
          default: false
      additionalProperties: false
      type: "object"
      title: "CreateEnvironmentRequest"
    CreateEnvironmentTwinRequest:
      properties:
        twin:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Twin"
          description: "Slug of the twin to serve"
        seed:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
          title: "Seed"
          description: "A generated starting state to load into this twin, by `seeds.id`. Omitted starts the twin with its own state and nothing else."
        description:
          anyOf:
            - type: "string"
              maxLength: 2000
              minLength: 1
            - type: "null"
          title: "Description"
          description: "Generate the first dataset in this twin before it becomes ready."
      additionalProperties: false
      type: "object"
      required:
        - "twin"
      title: "CreateEnvironmentTwinRequest"
    CreateExportRequest:
      properties:
        environment_twin_ids:
          anyOf:
            - items:
                type: "string"
                format: "uuid"
              type: "array"
              minItems: 1
            - type: "null"
          title: "Environment Twin Ids"
          description: "Twin slots inside this environment to export, by `environment_twins.id`. Omitted exports every twin; an empty list would export none, which is never what a caller means."
        occurred_from:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Occurred From"
          description: "Export calls served at or after this instant."
        occurred_until:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Occurred Until"
          description: "Export calls served at or before this instant. An export never reads past the moment it was asked for, whatever this says."
      additionalProperties: false
      type: "object"
      title: "CreateExportRequest"
    CreateOrganizationRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
          description: "Display name of the new organization"
      additionalProperties: false
      type: "object"
      required:
        - "name"
      title: "CreateOrganizationRequest"
    CreateScenarioRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
        twins:
          items:
            anyOf:
              - type: "string"
                maxLength: 100
                minLength: 1
              - $ref: "#/components/schemas/ScenarioTwinRequest"
          type: "array"
          maxItems: 25
          minItems: 1
          title: "Twins"
      additionalProperties: false
      type: "object"
      required:
        - "name"
        - "twins"
      title: "CreateScenarioRequest"
    CreateSeedRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
          description: "Display name of the seed"
        twin:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Twin"
          description: "Slug of the twin this seed is for"
        prompt:
          type: "string"
          maxLength: 2000
          minLength: 1
          title: "Prompt"
          description: "The starting state you want, in your own words. \"50 open tickets, half of them aging past 90 days.\""
      additionalProperties: false
      type: "object"
      required:
        - "name"
        - "twin"
        - "prompt"
      title: "CreateSeedRequest"
    CreatedApiKeyResponse:
      properties:
        id:
          type: "string"
          format: "uuid"
          title: "Id"
        name:
          type: "string"
          title: "Name"
        created_at:
          type: "string"
          format: "date-time"
          title: "Created At"
        expires_at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Expires At"
          description: "When the key stops working, or null when it never does"
        created_by:
          $ref: "#/components/schemas/UserResponse"
          description: "The member whose role the key acts with. Demoting or removing them changes what the key can do."
        token:
          type: "string"
          title: "Token"
          description: "The credential itself, to send in the `X-API-Key` header. Only the digest is stored, so this is the only time it is readable."
      type: "object"
      required:
        - "id"
        - "name"
        - "created_at"
        - "expires_at"
        - "created_by"
        - "token"
      title: "CreatedApiKeyResponse"
    EnvironmentCredentialResponse:
      properties:
        api_key:
          type: "string"
          title: "Api Key"
      type: "object"
      required:
        - "api_key"
      title: "EnvironmentCredentialResponse"
      description: "The provider key a container minted, handed over exactly once."
    EnvironmentRecordResponse:
      properties:
        external_id:
          type: "string"
          title: "External Id"
        resource:
          type: "string"
          title: "Resource"
        body:
          additionalProperties: true
          type: "object"
          title: "Body"
      type: "object"
      required:
        - "external_id"
        - "resource"
        - "body"
      title: "EnvironmentRecordResponse"
    EnvironmentResponse:
      properties:
        id:
          type: "string"
          format: "uuid"
          title: "Id"
        slug:
          type: "string"
          title: "Slug"
        name:
          type: "string"
          title: "Name"
        status:
          type: "string"
          title: "Status"
        twins:
          items:
            $ref: "#/components/schemas/EnvironmentTwinResponse"
          type: "array"
          title: "Twins"
        created_at:
          type: "string"
          format: "date-time"
          title: "Created At"
        expires_at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Expires At"
      type: "object"
      required:
        - "id"
        - "slug"
        - "name"
        - "status"
        - "twins"
        - "created_at"
      title: "EnvironmentResponse"
    EnvironmentTwinResponse:
      properties:
        id:
          type: "string"
          format: "uuid"
          title: "Id"
        environment_id:
          type: "string"
          format: "uuid"
          title: "Environment Id"
        twin_slug:
          type: "string"
          title: "Twin Slug"
        twin_version:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Twin Version"
          description: "The release the current container was started from."
        seed:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
          title: "Seed"
          description: "The starting state this twin was created with, if any."
        desired_state:
          type: "string"
          title: "Desired State"
          description: "running or stopped"
        state:
          type: "string"
          title: "State"
          description: "What the twin is actually doing: pending, provisioning, starting, ready, stopping, stopped or failed."
        url:
          type: "string"
          title: "Url"
        failure:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Failure"
          description: "Why the current run is not serving, if it is not."
        created_at:
          type: "string"
          format: "date-time"
          title: "Created At"
        ready_at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Ready At"
      type: "object"
      required:
        - "id"
        - "environment_id"
        - "twin_slug"
        - "desired_state"
        - "state"
        - "url"
        - "created_at"
      title: "EnvironmentTwinResponse"
    ExportDownloadResponse:
      properties:
