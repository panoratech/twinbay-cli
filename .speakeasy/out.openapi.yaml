openapi: "3.1.0"
info:
  title: "Twinbay"
  description: "Backend API"
  version: "0.1.0"
servers:
  - url: "https://api.twinbay.ai"
    description: "Production"
paths:
  /users/me:
    get:
      tags:
        - "users"
      summary: "Read the authenticated user"
      description: "Returns the caller, the organization their token acts in, and every organization they belong to with their role in each. A caller who has not joined an organization yet gets a null active organization, which is how the client knows to show onboarding."
      operationId: "read_me"
      responses:
        "200":
          description: "The caller and their memberships"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The token names an organization with a role we do not model"
      security:
        - Organization API key: []
      x-speakeasy-name-override: "retrieve"
  /organizations:
    get:
      tags:
        - "organizations"
      summary: "List your organizations"
      description: "Every organization the caller is a member of, with their role in each, oldest membership first. Independent of the organization the current token acts in. Paginated: walk the pages with `page` and `size`."
      operationId: "list_organizations"
      security:
        - Organization API key: []
      parameters:
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            description: "Page number"
            default: 1
            title: "Page"
          description: "Page number"
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 100
            minimum: 1
            description: "Page size"
            default: 50
            title: "Size"
          description: "Page size"
      responses:
        "200":
          description: "One page of the caller's memberships"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_MembershipResponse_"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    post:
      tags:
        - "organizations"
      summary: "Create an organization"
      description: "Creates the organization in WorkOS with the caller as an admin, then mirrors it locally. The caller's current token is unchanged; refresh the AuthKit session into the new organization to act inside it."
      operationId: "create_organization"
      security:
        - Organization API key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: "The new organization and the caller's role in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /organizations/default:
    post:
      tags:
        - "organizations"
      summary: "Create your first organization"
      description: "Idempotent: answers with the caller's oldest organization when they already belong to one, and otherwise creates one named after them, with the caller as an admin. This is what signing up calls, so that onboarding never has to ask for a name. Refresh the AuthKit session into the organization to act inside it."
      operationId: "ensure_default_organization"
      responses:
        "200":
          description: "The caller's organization and their role in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
      security:
        - Organization API key: []
      x-speakeasy-ignore: true
  /organizations/current:
    get:
      tags:
        - "organizations"
      summary: "Read the active organization"
      description: "The organization the access token acts in, plus the caller's role in it. Fails with 403 when the token names no organization."
      operationId: "read_current_organization"
      responses:
        "200":
          description: "The active organization and the caller's role in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
      security:
        - Organization API key: []
      x-speakeasy-name-override: "retrieve"
    patch:
      tags:
        - "organizations"
      summary: "Rename the active organization"
      description: "Requires the **admin** role or above in the active organization."
      operationId: "rename_current_organization"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
        required: true
      responses:
        "200":
          description: "The renamed organization and the caller's role in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The token names no organization, or the caller's role is below admin"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security:
        - Organization API key: []
      x-speakeasy-name-override: "update"
  /organizations/current/api-keys:
    post:
      tags:
        - "api-keys"
      summary: "Create an API key"
      description: "Mints a key for the active organization. It acts with the caller's role, read from their membership on every request, so it can never outrank them. The response is the only time the token is readable."
      operationId: "create_api_key"
      security:
        - Organization API key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: "The new key, including its token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKeyResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization, or it is an API key"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - "api-keys"
      summary: "List API keys"
      description: "Every key of the active organization that has not been revoked, oldest first. A key that has expired is still listed, so that it can be read and cleaned up rather than vanishing unexplained; `expires_at` says which. Tokens are never included. Paginated: walk the pages with `page` and `size`."
      operationId: "list_api_keys"
      security:
        - Organization API key: []
      parameters:
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            description: "Page number"
            default: 1
            title: "Page"
          description: "Page number"
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 100
            minimum: 1
            description: "Page size"
            default: 50
            title: "Size"
          description: "Page size"
      responses:
        "200":
          description: "One page of the organization's keys"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_ApiKeyResponse_"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization, or it is an API key"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /organizations/current/api-keys/{api_key_id}:
    delete:
      tags:
        - "api-keys"
      summary: "Revoke an API key"
      description: "The key stops working immediately. Its row stays, so a key seen in a log can still be named, and its token can never be minted again."
      operationId: "revoke_api_key"
      security:
        - Organization API key: []
      parameters:
        - name: "api_key_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Api Key Id"
      responses:
        "204":
          description: "Successful Response"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization, or it is an API key"
        "404":
          description: "No live key of the active organization has this id, whether because it belongs to another organization or because it is already revoked"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /twins/catalog:
    get:
      tags:
        - "catalog"
      summary: "List available twins"
      description: "Returns the registered code twins ordered by display name."
      operationId: "list_twins"
      security:
        - Organization API key: []
      parameters:
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            default: 1
            title: "Page"
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 100
            minimum: 1
            default: 50
            title: "Size"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_TwinResponse_"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-group: "catalog"
      x-speakeasy-name-override: "list"
  /twins/catalog/{twin_slug}:
    get:
      tags:
        - "catalog"
      summary: "Retrieve a twin"
      operationId: "get_twin"
      security:
        - Organization API key: []
      parameters:
        - name: "twin_slug"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Twin Slug"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwinResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "404":
          description: "Twin not found"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-group: "catalog"
      x-speakeasy-name-override: "retrieve"
  /environments:
    get:
      tags:
        - "environments"
      summary: "List environments"
      operationId: "list_environments"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EnvironmentResponse"
                type: "array"
                title: "Response List Environments"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
      security:
        - Organization API key: []
      x-speakeasy-name-override: "list"
    post:
      tags:
        - "environments"
      summary: "Create an environment"
      description: "Records the environment and queues each twin for provisioning. The twins are not serving yet: read each one with `wait_for=ready`, then collect its API key."
      operationId: "create_environment"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
        required: true
      responses:
        "202":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security:
        - Organization API key: []
      x-speakeasy-name-override: "create"
  /environments/{environment_id}:
    get:
      tags:
        - "environments"
      summary: "Retrieve an environment"
      operationId: "get_environment"
      security:
        - Organization API key: []
      parameters:
        - name: "environment_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Environment Id"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-name-override: "retrieve"
  /twins/{twin_id}:
    get:
      tags:
        - "twins"
      summary: "Retrieve a twin"
      description: "With `wait_for`, the answer is held until the twin reaches that state, a run of it settles, or the wait runs out — so a caller waiting for a twin to serve sends one request rather than polling."
      operationId: "get_environment_twin"
      security:
        - Organization API key: []
      parameters:
        - name: "twin_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Twin Id"
        - name: "wait_for"
          in: "query"
          required: false
          schema:
            anyOf:
              - enum:
                  - "ready"
                  - "stopped"
                type: "string"
              - type: "null"
            title: "Wait For"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentTwinResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-group: "twins"
      x-speakeasy-name-override: "retrieve"
  /twins/{twin_id}/start:
    post:
      tags:
        - "twins"
      summary: "Start a twin"
      description: "Queues a fresh container. Its state and credentials are new."
      operationId: "start_environment_twin"
      security:
        - Organization API key: []
      parameters:
        - name: "twin_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Twin Id"
      responses:
        "202":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentTwinResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-group: "twins"
      x-speakeasy-name-override: "start"
  /twins/{twin_id}/stop:
    post:
      tags:
        - "twins"
      summary: "Stop a twin"
      description: "Queues the container for destruction. Everything it holds is lost."
      operationId: "stop_environment_twin"
      security:
        - Organization API key: []
      parameters:
        - name: "twin_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Twin Id"
      responses:
        "202":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentTwinResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-group: "twins"
      x-speakeasy-name-override: "stop"
  /twins/{twin_id}/credential:
    post:
      tags:
        - "twins"
      summary: "Collect the twin's API key"
      description: "Returns the key the twin's current container minted."
      operationId: "collect_environment_twin_credential"
      security:
        - Organization API key: []
      parameters:
        - name: "twin_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Twin Id"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentCredentialResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-group: "twins"
      x-speakeasy-name-override: "collect_credential"
  /twins/{twin_id}/records/{resource}:
    get:
      tags:
        - "twins"
      summary: "List twin state"
      operationId: "list_environment_records"
      security:
        - Organization API key: []
      parameters:
        - name: "twin_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Twin Id"
        - name: "resource"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Resource"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/EnvironmentRecordResponse"
                title: "Response List Environment Records"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-group: "twin_records"
      x-speakeasy-name-override: "list"
  /twins/{twin_id}/records/{resource}/{external_id}:
    put:
      tags:
        - "twins"
      summary: "Replace a twin record"
      operationId: "update_environment_record"
      security:
        - Organization API key: []
      parameters:
        - name: "twin_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Twin Id"
        - name: "resource"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Resource"
        - name: "external_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "External Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnvironmentRecordRequest"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentRecordResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-group: "twin_records"
      x-speakeasy-name-override: "update"
  /twins/{twin_id}/advance:
    post:
      tags:
        - "twins"
      summary: "Advance a deterministic twin lifecycle"
      operationId: "advance_environment"
      security:
        - Organization API key: []
      parameters:
        - name: "twin_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Twin Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceEnvironmentRequest"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                type: "object"
                additionalProperties:
                  type: "integer"
                title: "Response Advance Environment"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-group: "twins"
      x-speakeasy-name-override: "advance"
  /scenarios:
    get:
      tags:
        - "scenarios"
      summary: "List scenarios"
      description: "Start an environment from a scenario by sending its id as `scenario` to `POST /environments`."
      operationId: "list_scenarios"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ScenarioResponse"
                type: "array"
                title: "Response List Scenarios"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
      security:
        - Organization API key: []
      x-speakeasy-name-override: "list"
    post:
      tags:
        - "scenarios"
      summary: "Create a scenario"
      description: "Save providers and optional reusable seeds without starting an environment."
      operationId: "create_scenario"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScenarioRequest"
        required: true
      responses:
        "201":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security:
        - Organization API key: []
      x-speakeasy-name-override: "create"
  /scenarios/{scenario_id}:
    get:
      tags:
        - "scenarios"
      summary: "Retrieve a scenario"
      operationId: "get_scenario"
      security:
        - Organization API key: []
      parameters:
        - name: "scenario_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Scenario Id"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "401":
          description: "The credential is missing, malformed, expired, or not trusted"
        "403":
          description: "The credential does not act inside an organization"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      x-speakeasy-name-override: "retrieve"
    patch:
      tags:
        - "scenarios"
      summary: "Update a scenario"
      description: "Change the name or replace provider selections. Existing environments are untouched."
      operationId: "update_scenario"
      security:
        - Organization API key: []
      parameters:
        - name: "scenario_id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Scenario Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScenarioRequest"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "401":
