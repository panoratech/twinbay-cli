components:
  schemas:
    AdvanceEnvironmentRequest:
      properties:
        at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "At"
          description: "Instant to advance the environment to. Defaults to now."
      additionalProperties: false
      type: "object"
      title: "AdvanceEnvironmentRequest"
    ApiKeyResponse:
      properties:
        id:
          type: "string"
          format: "uuid"
          title: "Id"
        name:
          type: "string"
          title: "Name"
        created_at:
          type: "string"
          format: "date-time"
          title: "Created At"
        expires_at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Expires At"
          description: "When the key stops working, or null when it never does"
        created_by:
          $ref: "#/components/schemas/UserResponse"
          description: "The member whose role the key acts with. Demoting or removing them changes what the key can do."
      type: "object"
      required:
        - "id"
        - "name"
        - "created_at"
        - "expires_at"
        - "created_by"
      title: "ApiKeyResponse"
    ApiSchemaProvenance:
      properties:
        twin:
          type: "string"
          title: "Twin"
        twin_version:
          type: "string"
          title: "Twin Version"
        image_digest:
          type: "string"
          title: "Image Digest"
        description:
          type: "string"
          title: "Description"
        resources:
          items:
            type: "string"
          type: "array"
          title: "Resources"
        sdk_targets:
          items:
            type: "string"
          type: "array"
          title: "Sdk Targets"
      type: "object"
      required:
        - "twin"
        - "twin_version"
        - "image_digest"
        - "description"
      title: "ApiSchemaProvenance"
    CompilerProvenance:
      properties:
        provider:
          type: "string"
          title: "Provider"
        model:
          type: "string"
          title: "Model"
      type: "object"
      required:
        - "provider"
        - "model"
      title: "CompilerProvenance"
    CreateApiKeyRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
          description: "What this key is for, in the operator's words"
        expires_at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Expires At"
          description: "When the key stops working on its own. Omitted or null for a key that only stops when it is revoked."
      additionalProperties: false
      type: "object"
      required:
        - "name"
      title: "CreateApiKeyRequest"
    CreateEnvironmentRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
          description: "Display name of the new environment. Generated when omitted."
        twins:
          anyOf:
            - items:
                anyOf:
                  - type: "string"
                    maxLength: 100
                    minLength: 1
                  - $ref: "#/components/schemas/CreateEnvironmentTwinRequest"
              type: "array"
              maxItems: 25
              minItems: 1
            - type: "null"
          title: "Twins"
          description: "Provider twins to provision, as slugs or objects with an optional seed. Omitted when a scenario supplies the twins."
        scenario:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
          title: "Scenario"
          description: "A saved environment definition to start from, instead of listing twins. Its twins are used as they were saved."
        save_as_scenario:
          type: "boolean"
          title: "Save As Scenario"
          description: "Also save this environment's definition, so another environment can be started from it later."
          default: false
      additionalProperties: false
      type: "object"
      title: "CreateEnvironmentRequest"
    CreateEnvironmentTwinRequest:
      properties:
        twin:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Twin"
          description: "Slug of the twin to serve"
        seed:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
          title: "Seed"
          description: "A generated starting state to load into this twin, by `seeds.id`. Omitted starts the twin with its own state and nothing else."
        description:
          anyOf:
            - type: "string"
              maxLength: 2000
              minLength: 1
            - type: "null"
          title: "Description"
          description: "Generate the first dataset in this twin before it becomes ready."
      additionalProperties: false
      type: "object"
      required:
        - "twin"
      title: "CreateEnvironmentTwinRequest"
    CreateEvaluationRequest:
      properties:
        test_run_id:
          type: "string"
          format: "uuid"
          title: "Test Run Id"
          description: "Test run whose attributed traffic should be graded."
          examples:
            - "b04bd7fb-3f6c-4de8-9c5a-918909419dcc"
        phase:
          type: "string"
          enum:
            - "checkpoint"
            - "final"
          title: "Phase"
          description: "Checkpoint grades without closing the run; final closes and grades it."
          examples:
            - "final"
        evaluator_id:
          anyOf:
            - type: "string"
              format: "uuid"
            - type: "null"
          title: "Evaluator Id"
          description: "Different ready evaluator used to regrade the latest ready capture for this run and phase."
          examples:
            - "1177bd8d-986f-44a2-aec2-1518dc46d6b0"
      additionalProperties: false
      type: "object"
      required:
        - "test_run_id"
        - "phase"
      title: "CreateEvaluationRequest"
    CreateEvaluatorRequest:
      properties:
        test_id:
          type: "string"
          format: "uuid"
          title: "Test Id"
          description: "Test to compile into matchers."
          examples:
            - "7ef34f0b-0ae6-4e26-ae92-f49d239d4d7d"
        test_version:
          anyOf:
            - type: "integer"
              exclusiveMinimum: 0.0
            - type: "null"
          title: "Test Version"
          description: "Version to pin. When omitted, evaluator creation pins the latest test version."
          examples:
            - 3
        twins:
          items:
            type: "string"
            maxLength: 100
            minLength: 1
          type: "array"
          maxItems: 10
          minItems: 1
          title: "Twins"
          description: "Catalog slugs of the twins whose APIs the outcomes are about."
          examples:
            - - "stripe"
      additionalProperties: false
      type: "object"
      required:
        - "test_id"
        - "twins"
      title: "CreateEvaluatorRequest"
    CreateExportRequest:
      properties:
        environment_twin_ids:
          anyOf:
            - items:
                type: "string"
                format: "uuid"
              type: "array"
              minItems: 1
            - type: "null"
          title: "Environment Twin Ids"
          description: "Twin slots inside this environment to export, by `environment_twins.id`. Omitted exports every twin; an empty list would export none, which is never what a caller means."
        occurred_from:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Occurred From"
          description: "Export calls served at or after this instant."
        occurred_until:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Occurred Until"
          description: "Export calls served at or before this instant. An export never reads past the moment it was asked for, whatever this says."
      additionalProperties: false
      type: "object"
      title: "CreateExportRequest"
    CreateOrganizationRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
          description: "Display name of the new organization"
      additionalProperties: false
      type: "object"
      required:
        - "name"
      title: "CreateOrganizationRequest"
    CreateScenarioRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
        twins:
          items:
            anyOf:
              - type: "string"
                maxLength: 100
                minLength: 1
              - $ref: "#/components/schemas/ScenarioTwinRequest"
          type: "array"
          maxItems: 25
          minItems: 1
          title: "Twins"
      additionalProperties: false
      type: "object"
      required:
        - "name"
        - "twins"
      title: "CreateScenarioRequest"
    CreateSeedRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
          description: "Display name of the seed"
          examples:
            - "aging-backlog"
        twin:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Twin"
          description: "Slug of the twin this seed is for"
          examples:
            - "zendesk"
        prompt:
          type: "string"
          maxLength: 2000
          minLength: 1
          title: "Prompt"
          description: "The starting state you want, in your own words. \"50 open tickets, half of them aging past 90 days.\""
          examples:
            - "50 open tickets, half of them aging past 90 days."
      additionalProperties: false
      type: "object"
      required:
        - "name"
        - "twin"
        - "prompt"
      title: "CreateSeedRequest"
    CreateTestRequest:
      properties:
        task_description:
          type: "string"
          maxLength: 2000
          minLength: 1
          title: "Task Description"
        outcomes:
          items:
            $ref: "#/components/schemas/OutcomeRequest"
          type: "array"
          maxItems: 50
          minItems: 1
          title: "Outcomes"
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
      additionalProperties: false
      type: "object"
      required:
        - "task_description"
        - "outcomes"
        - "name"
