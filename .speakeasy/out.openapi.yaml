  securitySchemes:
    Access token:
      type: "http"
      description: "Access token issued by WorkOS AuthKit."
      scheme: "bearer"
    Organization API key:
      type: "apiKey"
      description: "An organization API key. Create one at https://console.twinbay.ai/api-keys"
      in: "header"
      name: "X-API-Key"
tags:
  - name: "healthchecks"
    description: "Healthcheck endpoints"
  - name: "users"
    description: "The current user. Sign-up and sign-in happen in WorkOS AuthKit, which issues the access tokens this API accepts."
  - name: "organizations"
    description: "Organizations the caller belongs to. Every authenticated request acts inside exactly one organization — the one its access token names — so these routes address it as `current`."
  - name: "api-keys"
    description: "Long-lived credentials for callers that cannot hold an AuthKit session — agents, SDKs, CI. A key is accepted wherever an access token is, and acts with the role its creator holds when the request arrives."
  - name: "environments"
    description: "Create and edit isolated provider environments. Each environment contains behavioural twins from the `twins` package."
  - name: "twins"
    description: "Manage provisioned twins by their IDs."
  - name: "catalog"
    description: "Browse the digital twins available for new environments."
  - name: "scenarios"
    description: "Reusable starting setups of provider twins and optional seeds."
  - name: "seeds"
    description: "Starting states for a twin. Describe the data you want in your own words, and a worker expands it into rows once; pass the seed's id when you create an environment to start a twin holding it."
  - name: "tests"
    description: "Outcomes described in natural language, compiled once into request matchers, and evaluated deterministically against the traffic an attempt was served."
x-speakeasy-cli-commands:
  version: 1
  commands:
    evaluators create-and-wait:
      summary: "Create an evaluator and wait"
      description: "Compile a test into request matchers and wait until the evaluator is ready. When test-version is omitted, creation pins the latest test version. Use --async to return the queued evaluator immediately."
      op: "create_evaluator"
      async:
        op: "get_evaluator"
        id:
          from: "$.id"
          to:
            in: "path"
            name: "evaluator_id"
        statePointer: "$.status"
        states:
          pending: "pending"
          running: "pending"
          ready: "success"
          error: "failure"
        interval: "1s"
        backoff: 1.5
        maxInterval: "10s"
        timeout: "30m"
        errorField: "last_error"
        errorMessageField: "message"
      examples:
        latest:
          summary: "Compile the latest test version"
          command: "twinbay evaluators create-and-wait --test-id 7ef34f0b-0ae6-4e26-ae92-f49d239d4d7d --twins stripe"
        pinned:
          summary: "Compile a specific test version"
          command: "twinbay evaluators create-and-wait --test-id 7ef34f0b-0ae6-4e26-ae92-f49d239d4d7d --test-version 3 --twins stripe"
      help:
        defaults: "omitting test-version pins the latest version at creation"
        escalate: "use evaluators create for the complete API request surface"
      hints:
        CLI_ASYNC_FAILED: "Inspect last_error in the terminal response."
        CLI_ASYNC_TIMEOUT: "Resume with evaluators retrieve and the returned id."
    evaluations create-and-wait:
      summary: "Evaluate a test run and wait"
      description: "Capture and grade a test run, then wait for the verdict. Only passed exits successfully; failed, inconclusive, and error are failures. Naming another evaluator regrades the latest ready capture for the same phase. Use --async to return the queued evaluation immediately."
      op: "create_evaluation"
      async:
        op: "get_evaluation"
        id:
          from: "$.id"
          to:
            in: "path"
            name: "evaluation_id"
        statePointer: "$.verdict"
        states:
          pending: "pending"
          passed: "success"
          failed: "failure"
          inconclusive: "failure"
          error: "failure"
        interval: "1s"
        backoff: 1.5
        maxInterval: "10s"
        timeout: "10m"
      examples:
        final:
          summary: "Finish and grade a test run"
          command: "twinbay evaluations create-and-wait --test-run-id b04bd7fb-3f6c-4de8-9c5a-918909419dcc --phase final"
        regrade:
          summary: "Regrade the latest ready final capture"
          command: "twinbay evaluations create-and-wait --test-run-id b04bd7fb-3f6c-4de8-9c5a-918909419dcc --phase final --evaluator-id 1177bd8d-986f-44a2-aec2-1518dc46d6b0"
      help:
        defaults: "only a passed verdict exits zero"
        escalate: "use evaluations create for the complete API request surface"
      hints:
        CLI_ASYNC_FAILED: "Inspect verdict and error_message in the response."
        CLI_ASYNC_TIMEOUT: "Resume with evaluations retrieve and the returned id."
    seeds create-and-wait:
      summary: "Generate a seed and wait"
      description: "Generate a reusable starting state and wait until it is ready. Use --async to return the queued seed immediately."
      op: "create_seed"
      args:
        prompt:
          to: "$.prompt"
          type: "string"
          required: true
          variadic: true
          summary: "Starting state to generate"
      async:
        op: "get_seed"
        id:
          from: "$.id"
          to:
            in: "path"
            name: "seed_id"
        statePointer: "$.status"
        states:
          pending: "pending"
          running: "pending"
          ready: "success"
          failed: "failure"
        interval: "1s"
        backoff: 1.5
        maxInterval: "10s"
        timeout: "2h"
      examples:
        tickets:
          summary: "Generate a support backlog"
          command: "twinbay seeds create-and-wait --name aging-backlog --twin zendesk \"50 open tickets, half aging past 90 days\""
      help:
        escalate: "use seeds create for the complete API request surface"
      hints:
        CLI_ASYNC_FAILED: "Inspect failure in the terminal response."
        CLI_ASYNC_TIMEOUT: "Resume with seeds retrieve and the returned id."
security:
  - Access token: []
  - Organization API key: []
