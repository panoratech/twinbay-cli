          type: "string"
          format: "date-time"
          title: "Expires At"
      type: "object"
      required:
        - "url"
        - "expires_at"
      title: "ExportDownloadResponse"
      description: "A short-lived link to the exported file, which has no other door."
    ExportResponse:
      properties:
        id:
          type: "string"
          format: "uuid"
          title: "Id"
        environment_id:
          type: "string"
          format: "uuid"
          title: "Environment Id"
        status:
          type: "string"
          title: "Status"
          description: "pending, running, ready or failed"
        slice:
          $ref: "#/components/schemas/ExportSlice"
          description: "The traffic this export was asked for."
        failure:
          anyOf:
            - type: "string"
            - type: "null"
          title: "Failure"
          description: "Why generation failed, if it did."
        created_at:
          type: "string"
          format: "date-time"
          title: "Created At"
        completed_at:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Completed At"
      type: "object"
      required:
        - "id"
        - "environment_id"
        - "status"
        - "slice"
        - "created_at"
      title: "ExportResponse"
    ExportSlice:
      properties:
        environment_twin_ids:
          anyOf:
            - items:
                type: "string"
                format: "uuid"
              type: "array"
              minItems: 1
            - type: "null"
          title: "Environment Twin Ids"
          description: "Twin slots inside this environment to export, by `environment_twins.id`. Omitted exports every twin; an empty list would export none, which is never what a caller means."
        occurred_from:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Occurred From"
          description: "Export calls served at or after this instant."
        occurred_until:
          anyOf:
            - type: "string"
              format: "date-time"
            - type: "null"
          title: "Occurred Until"
          description: "Export calls served at or before this instant. An export never reads past the moment it was asked for, whatever this says."
      type: "object"
      title: "ExportSlice"
      description: "The traffic an export was asked for, where null means no limit.\n\nThe same shape on the way in and on the way out, and it is echoed into the\nexported file: a filtered export and a whole-environment one are otherwise\nindistinguishable, which is the difference between a dataset and a wrong\ndataset."
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: "array"
          title: "Detail"
      type: "object"
      title: "HTTPValidationError"
