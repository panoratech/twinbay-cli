          type: "string"
          format: "uuid"
          title: "Id"
        environment_id:
          type: "string"
          format: "uuid"
          title: "Environment Id"
        environment_twin_id:
          type: "string"
          format: "uuid"
          title: "Environment Twin Id"
        method:
          type: "string"
          title: "Method"
        path:
          type: "string"
          title: "Path"
        query_string:
          type: "string"
          title: "Query String"
        status_code:
          type: "integer"
          title: "Status Code"
        duration_ms:
          type: "integer"
          title: "Duration Ms"
        occurred_at:
          type: "string"
          format: "date-time"
          title: "Occurred At"
      type: "object"
      required:
        - "id"
        - "environment_id"
        - "environment_twin_id"
        - "method"
        - "path"
        - "query_string"
        - "status_code"
        - "duration_ms"
        - "occurred_at"
      title: "RequestLogSummaryResponse"
    ScenarioResponse:
      properties:
        slug:
          type: "string"
          title: "Slug"
        name:
          type: "string"
          title: "Name"
        description:
          type: "string"
          title: "Description"
      type: "object"
      required:
        - "slug"
        - "name"
        - "description"
      title: "ScenarioResponse"
    TwinResponse:
      properties:
        slug:
          type: "string"
          title: "Slug"
        name:
          type: "string"
          title: "Name"
        description:
          type: "string"
          title: "Description"
        version:
          type: "string"
          title: "Version"
        scenarios:
          items:
            $ref: "#/components/schemas/ScenarioResponse"
          type: "array"
          title: "Scenarios"
      type: "object"
      required:
        - "slug"
        - "name"
        - "description"
        - "version"
        - "scenarios"
      title: "TwinResponse"
    UpdateEnvironmentRecordRequest:
      properties:
        fields:
          additionalProperties: true
          type: "object"
          title: "Fields"
          description: "The record's fields, as the provider's API returns them."
      additionalProperties: false
      type: "object"
      required:
        - "fields"
      title: "UpdateEnvironmentRecordRequest"
    UpdateOrganizationRequest:
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Name"
          description: "New display name of the organization"
      additionalProperties: false
      type: "object"
      required:
        - "name"
      title: "UpdateOrganizationRequest"
    UserResponse:
      properties:
        id:
          type: "string"
          format: "uuid"
          title: "Id"
        email:
          type: "string"
          format: "email"
          title: "Email"
        first_name:
          type: "string"
          title: "First Name"
        last_name:
          type: "string"
          title: "Last Name"
      type: "object"
      required:
